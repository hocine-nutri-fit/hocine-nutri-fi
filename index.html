
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>HOCINE NUTRI-FIT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px;background:#17243a}
header h1{color:#37df9b;font-size:27px}
header p{color:#c5d1df}
button{border:0;border-radius:12px;padding:13px;background:#27c987;color:#10251e;font-size:16px;font-weight:bold}
.container{padding:18px;max-width:600px;margin:auto}
.card{background:#1c2b40;padding:20px;border-radius:16px;margin:15px 0}
.card h2{color:#37df9b}
.card p{line-height:1.8;color:#d5dfeb}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions button{width:100%}
#content{line-height:1.8}
footer{text-align:center;padding:25px;color:#9baaba}
</style>
</head>
<body>
<header>
<h1>HOCINE NUTRI-FIT</h1>
<p id="subtitle">الرياضة والتغذية نحو جسم أفضل</p>
<button onclick="changeLang()" id="lang">English</button>
</header>
<div class="container">
<div class="card">
<h2 id="welcome">مرحبا بك في عالم اللياقة 💪</h2>
<p id="intro">برنامجك الرياضي والغذائي لبناء جسم صحي وتحقيق هدفك.</p>
</div>
<div class="actions">
<button onclick="show('sport')" id="sportBtn">🏋️ التمارين</button>
<button onclick="show('food')" id="foodBtn">🥗 التغذية</button>
<button onclick="show('cut')" id="cutBtn">🔥 التنشيف</button>
<button onclick="show('about')" id="aboutBtn">👤 عن التطبيق</button>
</div>
<div class="card">
<div id="content">
<h2>ابدأ رحلتك اليوم</h2>
<p>اختر القسم الذي تريد استكشافه.</p>
</div>
</div>
</div>
<footer>© HOCINE NUTRI-FIT</footer>
<script>
let english=false;
function changeLang(){
english=!english;
document.documentElement.lang=english?'en':'ar';
document.documentElement.dir=english?'ltr':'rtl';
document.getElementById('lang').innerText=english?'العربية':'English';
document.getElementById('subtitle').innerText=english?'Fitness and Nutrition for a Better Body':'الرياضة والتغذية نحو جسم أفضل';
document.getElementById('welcome').innerText=english?'Welcome to your fitness journey 💪':'مرحبا بك في عالم اللياقة 💪';
document.getElementById('intro').innerText=english?'Your fitness and nutrition guide.':'برنامجك الرياضي والغذائي لبناء جسم صحي وتحقيق هدفك.';
document.getElementById('sportBtn').innerText=english?'🏋️ Workouts':'🏋️ التمارين';
document.getElementById('foodBtn').innerText=english?'🥗 Nutrition':'🥗 التغذية';
document.getElementById('cutBtn').innerText=english?'🔥 Fat Loss':'🔥 التنشيف';
document.getElementById('aboutBtn').innerText=english?'👤 About':'👤 عن التطبيق';
document.getElementById('content').innerHTML=english?'<h2>Start your journey</h2><p>Choose a section to explore.</p>':'<h2>ابدأ رحلتك اليوم</h2><p>اختر القسم الذي تريد استكشافه.</p>';
}
function show(section){
let data={
sport:['التمارين الرياضية 🏋️','ابدأ بالإحماء 5 إلى 10 دقائق. مارس تمارين المقاومة والمشي أو الجري، وخذ وقتا للراحة.','Workouts 🏋️','Warm up for 5 to 10 minutes. Practice resistance exercises and walking or running.'],
food:['التغذية الصحية 🥗','تناول البيض والدجاج والسمك والبقوليات والخضروات والفواكه. اهتم بالبروتين والماء والتوازن الغذائي.','Healthy Nutrition 🥗','Eat eggs, chicken, fish, legumes, vegetables and fruits. Focus on protein, water and balanced meals.'],
cut:['برنامج التنشيف 🔥','التنشيف يعتمد على عجز معتدل في السعرات مع تناول بروتين كافٍ وتمارين المقاومة والنوم الجيد.','Fat Loss 🔥','Fat loss requires a moderate calorie deficit, enough protein, resistance training and good sleep.'],
about:['عن التطبيق 👤','HOCINE NUTRI-FIT تطبيق رياضي وغذائي مجاني للرجال والنساء.','About 👤','HOCINE NUTRI-FIT is a free fitness and nutrition app for men and women.']
};
let d=data[section];
document.getElementById('content').innerHTML='<h2>'+(english?d[2]:d[0])+'</h2><p>'+(english?d[3]:d[1])+'</p>';
}
</script>
</body>
</html>
